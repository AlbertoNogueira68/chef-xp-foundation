<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — ChefXP</title>
    <!--
      Este ecrã tem de existir sem rede, e por isso não depende de nada: sem
      folha de estilo externa, sem tipo de letra descarregado, sem JavaScript.
      Só aparece quando alguém abre uma página que nunca visitou estando
      offline — o que já foi visitado vem da cache e abre normalmente.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf7f2;
        color: #1c1917;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.6;
        color: #57534e;
        font-size: 0.95rem;
      }
      .marca {
        font-size: 1.5rem;
        font-weight: 700;
        color: #d97706;
        margin-bottom: 24px;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(90deg, #f59e0b, #ea580c);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1917;
          color: #fafaf9;
        }
        p {
          color: #a8a29e;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="marca">ChefXP</p>
      <h1>You're offline</h1>
      <p>
        This page had never been opened on this device, so it wasn't saved. Anything you've already
        visited still opens offline.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
