services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chefdev}
      POSTGRES_DB: ${POSTGRES_DB:-chef_xp}
    ports:
      - "5432:5432"
    volumes:
      - chef_xp_pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chef} -d ${POSTGRES_DB:-chef_xp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Caixa de correio de desenvolvimento: um servidor de SMTP que aceita tudo,
  # não pede credenciais e não deixa sair nada para a Internet. O que a app
  # enviar — verificação de email, link de recuperação — aparece em
  # http://localhost:8025 em vez de ir parar à caixa de alguém.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # a caixa de correio, no browser
      # O SMTP também sai para fora do compose, para quem corre o servidor na
      # máquina (`npm run dev`) em vez de no contentor: SMTP_HOST=localhost.
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Node 22 e não 20: as ferramentas de teste da interface (Vitest, jsdom)
    # exigem ^22.14, e em Node 20 o `npm install` do arranque falha a meio —
    # o contentor subia sem `concurrently` e morria sem servir nada.
    image: node:22-alpine
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chef}:${POSTGRES_PASSWORD:-chefdev}@postgres:5432/${POSTGRES_DB:-chef_xp}
      PORT: 3010
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-min-32-chars}
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      VITE_API_URL: /api
      VITE_APP_ENV: development
      # Sem as duas, o SSO fica desligado e o botão não aparece. O
      # `validateEnv` recusa arrancar com só uma delas.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Por omissão, o Mailpit aqui ao lado: a recuperação de password e a
      # confirmação de email funcionam acabado de clonar, sem conta nenhuma.
      # Quem quiser provar o envio a sério põe as suas variáveis no `.env`
      # (incluindo SMTP_AUTH=login) e estas cedem o lugar.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_AUTH: ${SMTP_AUTH:-none}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Chef XP <chef-xp@localhost>}
    ports:
      - "5173:5173"
      - "3010:3010"
    volumes:
      - .:/app
      - chef_xp_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev:all"

volumes:
  chef_xp_pgdata:
  chef_xp_node_modules:
