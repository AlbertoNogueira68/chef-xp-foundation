<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChefXP</title>
    <meta
      name="description"
      content="ChefXP — the gamified social platform for cooking more, discovering recipes and levelling up as a chef."
    />
    <meta property="og:title" content="ChefXP" />
    <meta
      property="og:description"
      content="ChefXP — the gamified social platform for cooking more, discovering recipes and levelling up as a chef."
    />
    <meta property="og:type" content="website" />
    <!-- Quando alguém partilha a app, o que aparece é a cara do chef. -->
    <meta property="og:image" content="/icons/icon-512.png" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- App instalável: o manifesto diz o nome, os ícones e onde abrir. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- A cor da barra do sistema quando a app corre instalada. -->
    <meta name="theme-color" content="#d97706" />
    <!-- O iOS ignora o manifesto para isto e quer as suas próprias etiquetas. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ChefXP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
